name: Build Pink Star Codex Pet

on:
  pull_request:
    branches:
      - main
    paths:
      - codex-pets/pink-star/build_pet.py
      - .github/workflows/pink-star-pet.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-pet:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || 'feat/pink-star-codex-pet' }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Generate action pack
        run: python codex-pets/pink-star/build_pet.py

      - name: Validate dimensions and transparency
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path

          root = Path("codex-pets/pink-star")
          v2 = Image.open(root / "spritesheet.png").convert("RGBA")
          v1 = Image.open(root / "spritesheet-v1.png").convert("RGBA")
          assert v2.size == (1536, 2288), v2.size
          assert v1.size == (1536, 1872), v1.size
          assert v2.getpixel((0, 0))[3] == 0
          assert v1.getpixel((0, 0))[3] == 0
          assert len(list((root / "actions").glob("*.gif"))) == 10
          print("Pink Star action pack passed validation")
          PY

      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add codex-pets/pink-star/spritesheet.png \
                  codex-pets/pink-star/spritesheet-v1.png \
                  codex-pets/pink-star/actions \
                  codex-pets/pink-star/validation.json
          if git diff --cached --quiet; then
            echo "Generated assets are already up to date."
          else
            git commit -m "build(pet): 生成 Pink Star Codex 动作包"
            git push origin HEAD:${{ github.head_ref || 'feat/pink-star-codex-pet' }}
          fi
