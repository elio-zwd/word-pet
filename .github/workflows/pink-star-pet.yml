name: Debug Pink Star Codex Pet

on:
  push:
    branches:
      - feat/pink-star-codex-pet
    paths:
      - codex-pets/pink-star/generate.py
      - .github/workflows/pink-star-pet.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  debug-generator:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/pink-star-codex-pet

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Capture generator output
        run: |
          set +e
          python codex-pets/pink-star/generate.py > codex-pets/pink-star/build.log 2>&1
          status=$?
          echo "exit_code=$status" >> codex-pets/pink-star/build.log
          cat codex-pets/pink-star/build.log
          exit 0

      - name: Commit diagnostic log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add codex-pets/pink-star/build.log
          git commit -m "chore(pet): 记录 Pink Star 生成器诊断" || true
          git push origin HEAD:feat/pink-star-codex-pet
